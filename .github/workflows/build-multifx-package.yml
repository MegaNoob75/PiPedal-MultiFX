name: Build MultiFX Raspberry Pi Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (example: 1.01)'
        required: true
        default: '1.01'
        type: string

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vite/package-lock.json
      - name: Install frontend dependencies
        working-directory: vite
        run: npm ci
      - name: Build frontend
        working-directory: vite
        run: npm run build
      - name: Assemble Raspberry Pi package
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          VERSION="${VERSION#multifx-v}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+([.][0-9]+)?$ ]] || { echo "Invalid version: ${RELEASE_VERSION}"; exit 1; }
          PACKAGE_NAME="PiPedal-MultiFX-v${VERSION}-RaspberryPi"
          STAGE="release/${PACKAGE_NAME}"
          rm -rf release
          mkdir -p "${STAGE}/react" "${STAGE}/multifx" "${STAGE}/systemd/system"
          cp -a vite/dist/. "${STAGE}/react/"
          cp install-pipedal-kiosk.sh install-multifx.sh uninstall-multifx.sh "${STAGE}/"
          chmod +x "${STAGE}/"*.sh
          cp multifx/controller-config.json multifx/pipedal_encoder_bridge.py multifx/MULTIFX_CONTROLLER_PROTOCOL.txt "${STAGE}/multifx/"
          cp multifx/systemd/system/pipedal-encoder.service multifx/systemd/system/pipedal-ydotoold.service "${STAGE}/systemd/system/"
          bash -n "${STAGE}/install-pipedal-kiosk.sh"
          bash -n "${STAGE}/install-multifx.sh"
          bash -n "${STAGE}/uninstall-multifx.sh"
          test -f "${STAGE}/react/index.html"
          test -f "${STAGE}/multifx/controller-config.json"
          test -f "${STAGE}/multifx/pipedal_encoder_bridge.py"
          (cd release && zip -qr "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}")
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "${GITHUB_ENV}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: release/${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error
          retention-days: 30
